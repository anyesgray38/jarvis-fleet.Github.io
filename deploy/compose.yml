services:
  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    network_mode: host
    command: >-
      sh -c 'mkdir -p /run/aegis &&
      if [ ! -s /run/aegis/server.crt ] || [ ! -s /run/aegis/server.key ]; then
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -keyout /run/aegis/server.key -out /run/aegis/server.crt -subj "/CN=aegis-fleet";
      fi &&
      exec python3 orchestrator.py --secret "$AEGIS_FLEET_SECRET"
      --port 4444 --api-port 8888 --cert /run/aegis/server.crt
      --key /run/aegis/server.key --headless'
    environment:
      AEGIS_FLEET_SECRET: ${AEGIS_FLEET_SECRET:?Set AEGIS_FLEET_SECRET}
      PYTHONUNBUFFERED: "1"
    volumes:
      - aegis-certs:/run/aegis
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s

  local-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    network_mode: host
    working_dir: /workspace
    command: >-
      sh -c 'exec python3 agent.py --host 127.0.0.1 --port 4444
      --secret "$AEGIS_FLEET_SECRET" --cert /run/aegis/server.crt --reconnect 5'
    environment:
      AEGIS_FLEET_SECRET: ${AEGIS_FLEET_SECRET:?Set AEGIS_FLEET_SECRET}
      AEGIS_AGENT_NAME: ${AEGIS_AGENT_NAME:-Aegis Local Worker}
      AEGIS_AGENT_TAGS: ${AEGIS_AGENT_TAGS:-local,research,knowledge,security,code-factory,business-prospecting,maintenance}
      USER: aegis-local
      PYTHONUNBUFFERED: "1"
    user: "${AEGIS_AGENT_UID:-1000}:${AEGIS_AGENT_GID:-1000}"
    volumes:
      - aegis-certs:/run/aegis:ro
      - ..:/workspace
    depends_on:
      orchestrator:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    network_mode: host
    command: ["python3", "aegis_gateway.py"]
    environment:
      AEGIS_GATEWAY_TOKEN: ${AEGIS_GATEWAY_TOKEN:?Set AEGIS_GATEWAY_TOKEN}
      AEGIS_GATEWAY_BIND: 127.0.0.1
      AEGIS_GATEWAY_PORT: 8877
      AEGIS_ORCHESTRATOR_URL: http://127.0.0.1:8888
      PYTHONUNBUFFERED: "1"
    depends_on:
      orchestrator:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8877/health', headers={'Authorization':'Bearer '+os.environ['AEGIS_GATEWAY_TOKEN']}), timeout=2); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s

  knowledge-runtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    network_mode: host
    command: ["python3", "knowledge_server.py"]
    environment:
      AEGIS_KNOWLEDGE_TOKEN: ${AEGIS_KNOWLEDGE_TOKEN:?Set AEGIS_KNOWLEDGE_TOKEN}
      AEGIS_KNOWLEDGE_BIND: 127.0.0.1
      AEGIS_KNOWLEDGE_PORT: 8892
      AEGIS_KNOWLEDGE_DATA: /app/knowledge-data
      AEGIS_KNOWLEDGE_INTERVAL_MINUTES: ${AEGIS_KNOWLEDGE_INTERVAL_MINUTES:-360}
      AEGIS_KNOWLEDGE_RESEARCH_ENABLED: ${AEGIS_KNOWLEDGE_RESEARCH_ENABLED:-1}
      AEGIS_KNOWLEDGE_MAX_JOBS_PER_CYCLE: ${AEGIS_KNOWLEDGE_MAX_JOBS_PER_CYCLE:-4}
      AEGIS_KNOWLEDGE_MAX_SEARCH_RESULTS: ${AEGIS_KNOWLEDGE_MAX_SEARCH_RESULTS:-3}
      AEGIS_KNOWLEDGE_MAX_EXTERNAL_CALLS: ${AEGIS_KNOWLEDGE_MAX_EXTERNAL_CALLS:-4}
      AEGIS_KNOWLEDGE_SOURCE_REFRESH_MINUTES: ${AEGIS_KNOWLEDGE_SOURCE_REFRESH_MINUTES:-1440}
      AEGIS_KNOWLEDGE_DEPARTMENTS_CONFIG: ${AEGIS_KNOWLEDGE_DEPARTMENTS_CONFIG:-/app/config/knowledge_departments.json}
      AEGIS_KNOWLEDGE_WIKI_TOPICS: ${AEGIS_KNOWLEDGE_WIKI_TOPICS:-}
      AEGIS_KNOWLEDGE_WEB_SOURCES: ${AEGIS_KNOWLEDGE_WEB_SOURCES:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_OAUTH_TOKEN: ${FIRECRAWL_OAUTH_TOKEN:-}
      FIRECRAWL_AUTHORIZATION: ${FIRECRAWL_AUTHORIZATION:-}
      FIRECRAWL_MCP_URL: ${FIRECRAWL_MCP_URL:-https://mcp.firecrawl.dev/v2/mcp}
      PYTHONUNBUFFERED: "1"
    volumes:
      - aegis-knowledge:/app/knowledge-data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8892/health', headers={'Authorization':'Bearer '+os.environ['AEGIS_KNOWLEDGE_TOKEN']}), timeout=2); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 8s

  prospecting-runtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    network_mode: host
    command: ["python3", "prospecting_server.py"]
    environment:
      AEGIS_PROSPECT_TOKEN: ${AEGIS_PROSPECT_TOKEN:?Set AEGIS_PROSPECT_TOKEN}
      AEGIS_PROSPECT_BIND: 127.0.0.1
      AEGIS_PROSPECT_PORT: 8893
      AEGIS_PROSPECT_DB: /app/prospect-data/prospects.db
      AEGIS_PROSPECT_SOURCE_URLS: ${AEGIS_PROSPECT_SOURCE_URLS:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_OAUTH_TOKEN: ${FIRECRAWL_OAUTH_TOKEN:-}
      FIRECRAWL_AUTHORIZATION: ${FIRECRAWL_AUTHORIZATION:-}
      FIRECRAWL_MCP_URL: ${FIRECRAWL_MCP_URL:-https://mcp.firecrawl.dev/v2/mcp}
      PYTHONUNBUFFERED: "1"
    volumes:
      - aegis-prospecting:/app/prospect-data
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 96
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8893/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 8s

  localai:
    image: localai/localai:latest
    network_mode: host
    command: ["--address", "127.0.0.1:8080"]
    environment:
      DEBUG: "false"
      MODELS_PATH: /models
    volumes:
      - localai-models:/models
      - localai-data:/data
    mem_limit: 1400m
    cpus: 1.5
    pids_limit: 128
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/models"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  model-runtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    network_mode: host
    command: ["python3", "aegis_chat_server.py"]
    environment:
      AEGIS_MODEL_BIND: 127.0.0.1
      AEGIS_MODEL_PORT: 8891
      AEGIS_LOCALAI_URL: ${AEGIS_LOCALAI_URL:-http://127.0.0.1:8080}
      AEGIS_OLLAMA_URL: ${AEGIS_OLLAMA_URL:-http://127.0.0.1:11434}
      AEGIS_OPENAI_API_KEY: ${AEGIS_OPENAI_API_KEY:-}
      AEGIS_OPENAI_URL: ${AEGIS_OPENAI_URL:-https://api.openai.com}
      PYTHONUNBUFFERED: "1"
    volumes:
      - aegis-evidence:/app/evidence
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    init: true
    restart: unless-stopped
    depends_on:
      localai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8891/health', timeout=2)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    network_mode: host
    environment:
      AEGIS_GATEWAY_URL: http://127.0.0.1:8877
      AEGIS_GATEWAY_TOKEN: ${AEGIS_GATEWAY_TOKEN:?Set AEGIS_GATEWAY_TOKEN}
      AEGIS_KNOWLEDGE_URL: http://127.0.0.1:8892
      AEGIS_KNOWLEDGE_TOKEN: ${AEGIS_KNOWLEDGE_TOKEN:?Set AEGIS_KNOWLEDGE_TOKEN}
      AEGIS_PROSPECT_URL: http://127.0.0.1:8893
      AEGIS_PROSPECT_TOKEN: ${AEGIS_PROSPECT_TOKEN:?Set AEGIS_PROSPECT_TOKEN}
      AEGIS_ORCHESTRATOR_URL: http://127.0.0.1:8888
      AEGIS_MODEL_RUNTIME_URL: http://127.0.0.1:8891
      SHARK_API_URL: ${SHARK_API_URL:-}
      SHARK_ADMIN_KEY: ${SHARK_ADMIN_KEY:-}
      NODE_ENV: production
      AEGIS_WEB_BIND: ${AEGIS_WEB_BIND:-127.0.0.1}
      HOSTNAME: ${AEGIS_WEB_BIND:-127.0.0.1}
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      orchestrator:
        condition: service_healthy
      model-runtime:
        condition: service_healthy
    command: ["npm", "run", "start", "--", "-H", "${AEGIS_WEB_BIND:-127.0.0.1}", "-p", "3000"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  aegis-certs:
  aegis-evidence:
  aegis-knowledge:
  aegis-prospecting:
  localai-models:
  localai-data:
