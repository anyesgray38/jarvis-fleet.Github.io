name: AEGIS Remote Worker

on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Project objective"
        required: true
        type: string
      repository:
        description: "Repository to operate on (owner/name)"
        required: true
        type: string
      ref:
        description: "Git ref to work from"
        required: true
        default: "master"
        type: string
      capability:
        description: "Governed worker capability"
        required: true
        default: "terminal.execute"
        type: choice
        options:
          - terminal.execute
      job_id:
        description: "AEGIS job identifier"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: aegis-remote-${{ inputs.repository }}-${{ inputs.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  worker:
    name: AEGIS project worker
    runs-on: [self-hosted, linux, aegis-worker]
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.AEGIS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout AEGIS control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: aegis

      - name: Checkout target project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: project
          token: ${{ secrets.AEGIS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Identify worker
        run: |
          set -euo pipefail
          echo "AEGIS_JOB_ID=${{ inputs.job_id || format('job_{0}', github.run_id) }}" >> "$GITHUB_ENV"
          echo "AEGIS_WORKER=$(hostname)" >> "$GITHUB_ENV"

      - name: Run governed project worker
        env:
          AEGIS_OBJECTIVE: ${{ inputs.objective }}
          AEGIS_CAPABILITY: ${{ inputs.capability }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/aegis" python3 -m jarvis.remote_worker \
            --project project \
            --job-id "$AEGIS_JOB_ID" \
            --capability "$AEGIS_CAPABILITY" \
            --issue "$GITHUB_REPOSITORY#$GITHUB_RUN_ID" \
            --objective "$AEGIS_OBJECTIVE"

      - name: Publish worker summary
        if: always()
        run: |
          {
            echo "## AEGIS Remote Worker"
            echo
            echo "Job: $AEGIS_JOB_ID"
            echo
            echo "Objective: ${{ inputs.objective }}"
            echo
            echo "Repository: ${{ inputs.repository }}"
            echo
            echo "Ref: ${{ inputs.ref }}"
            echo
            echo "Worker: $AEGIS_WORKER"
            echo
            echo "Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
