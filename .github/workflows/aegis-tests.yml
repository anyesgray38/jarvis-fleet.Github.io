name: AEGIS Tests

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject forbidden hosted deployment references
        run: |
          set -o pipefail
          files="$(git ls-files | grep -v '^\.github/workflows/aegis-tests\.yml$')"
          if [ -n "$files" ] && printf '%s\n' "$files" | xargs grep -niE 'vercel(\.com)?'; then
            echo "Forbidden hosted deployment reference detected. AEGIS is Tailscale/self-hosted only."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
