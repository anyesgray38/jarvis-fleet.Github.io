name: AEGIS Issue Worker

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  worker:
    env:
      GH_TOKEN: ${{ secrets.AEGIS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    if: startsWith(github.event.issue.title, '[AEGIS JOB]') && github.event.issue.user.login == github.repository_owner
    runs-on: [self-hosted, linux, aegis-worker]
    timeout-minutes: 120
    steps:
      - name: Checkout AEGIS control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse structured job request
        id: request
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re
          body = os.environ.get("BODY", "")
          fields = {}
          for key in ("job_id", "repository", "ref", "capability"):
              match = re.search(r"^" + re.escape(key) + r":\s*(.+)$", body, re.MULTILINE)
              if not match:
                  raise SystemExit(f"missing required field: {key}")
              fields[key] = match.group(1).strip()
          if not re.fullmatch(r"job_[a-f0-9]+", fields["job_id"]):
              raise SystemExit("invalid job_id")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", fields["repository"]):
              raise SystemExit("repository must be owner/name")
          objective = re.search(r"^### Objective\s*\n(.*?)(?:\n\n|\Z)", body, re.MULTILINE | re.DOTALL)
          if not objective:
              raise SystemExit("missing objective")
          fields["objective"] = objective.group(1).strip()
          for key, value in fields.items():
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"{key}<<EOF\n{value}\nEOF\n")
          PY

      - name: Report start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          WORKER: ${{ runner.name }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "AEGIS claimed job on worker $WORKER. Job: ${{ steps.request.outputs.job_id }}. Target: ${{ steps.request.outputs.repository }}@${{ steps.request.outputs.ref }}."

      - name: Checkout target project
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.request.outputs.repository }}
          ref: ${{ steps.request.outputs.ref }}
          path: project
          fetch-depth: 0
          token: ${{ secrets.AEGIS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run AEGIS project worker
        env:
          AEGIS_JOB_ID: ${{ steps.request.outputs.job_id }}
          AEGIS_OBJECTIVE: ${{ steps.request.outputs.objective }}
          AEGIS_CAPABILITY: ${{ steps.request.outputs.capability }}
        run: |
          set -euo pipefail
          python3 -m jarvis.remote_worker --project project --job-id "$AEGIS_JOB_ID" --capability "$AEGIS_CAPABILITY" --issue "$GITHUB_REPOSITORY#${{ github.event.issue.number }}" --objective "$AEGIS_OBJECTIVE"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          STATUS: ${{ job.status }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "AEGIS job result: **$STATUS**. Worker: ${{ runner.name }}. See the Actions run for execution and verification logs."
